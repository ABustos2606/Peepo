# Peepo: which input events are which physical control.
# One binding per line:  control  turn|key  CODE  [reverse] [device=NAME]
# The codes match config.txt: each encoder turns on its own relative axis and
# each push or stomp sends its own key, so device numbering never matters.
# Check them on the Pi with `evtest`, and add `reverse` if a knob turns the
# wrong way round.
enc1    turn  REL_X
enc2    turn  REL_Y
enc1    key   KEY_F13
enc2    key   KEY_F14
stomp1  key   KEY_F17
stomp2  key   KEY_F18
stomp3  key   KEY_F19
stomp4  key   KEY_F20
